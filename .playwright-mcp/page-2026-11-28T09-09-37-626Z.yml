          - tabpanel "1. Pasos del asistente" [ref=e89]:
            - generic [ref=e90]:
              - generic [ref=e92]:
                - heading "¿Cómo funciona el Asistente IA?" [level=3] [ref=e93]
                - paragraph [ref=e94]: Flujo principal de 5 pasos
              - generic [ref=e95]:
                - generic [ref=e96]:
                  - heading "Paso 1 — Requerimiento" [level=5] [ref=e97]
                  - paragraph [ref=e98]: "Ingrese la minuta, el correo o el incidente que llegó de Negocio, con su título, tipo de información, sistema, código de HU y área solicitante. Si todavía no lo va a analizar, use «Guardar y continuar después»: queda como borrador en la lista de historias."
                - generic [ref=e99]:
                  - heading "Paso 2 — Análisis del Analista y del Asesor Técnico" [level=5] [ref=e100]
                  - paragraph [ref=e101]: "El Agente Analista decide qué consultar (glosario, HU similares, estándares y checklist de vacíos) y clasifica la información en conocida, faltante, supuesta y ambigua. Lo que solo se sabe revisando el sistema (por ejemplo, en qué otros lugares aparece un dato) no se le pregunta a Negocio: se lo pasa al Asesor Técnico, que revisa el código enseguida. Puede tardar unos minutos."
                - generic [ref=e102]:
                  - heading "Paso 3 — Preguntas para Negocio" [level=5] [ref=e103]
                  - paragraph [ref=e104]: "El Analista y el Asesor Técnico trabajan en equipo y arman una sola ronda: arriba se muestra qué otras funciones afecta el cambio (por ejemplo, una carga masiva o un reporte), sin detalle técnico, y abajo un solo formulario con las preguntas del Analista y las decisiones del Asesor. Usted las lleva a Negocio, registra las respuestas y las envía."
                  - list [ref=e105]:
                    - listitem [ref=e106]: Si quedan vacíos, el Analista hace otra ronda. Una pregunta ya respondida no se vuelve a hacer.
                    - listitem [ref=e107]: "Si un punto se parece a algo que Negocio ya respondió, no se repregunta: pasa como supuesto que el Product Owner valida al aprobar."
                    - listitem [ref=e108]: "Lo que el Asesor no pudo confirmar en el código no se le pregunta a Negocio: queda como pendiente técnico para Desarrollo."
                    - listitem [ref=e109]: Puede guardar respuestas sin enviarlas (por ejemplo, si debe consultarlas) y terminarlas otro día.
                - generic [ref=e110]:
                  - heading "Paso 4 — Historia y criterios (borrador)" [level=5] [ref=e111]
                  - paragraph [ref=e112]: El Agente Redactor-Revisor escribe la historia en formato Como / Quiero / Para, con criterios Dado que / Cuando / Entonces que cubren también cada impacto en otros módulos y las decisiones tomadas, y la revisa hasta en dos rondas. El borrador se puede editar.
                - generic [ref=e113]:
                  - heading "Paso 5 — Aprobación del Product Owner" [level=5] [ref=e114]
                  - paragraph [ref=e115]: El Product Owner revisa la historia, el impacto en otros módulos, las decisiones tomadas y los supuestos a validar, y confirma que los datos están anonimizados. Puede aprobarla, devolverla a un agente con un motivo o rechazarla. Al aprobar, la HU se guarda en el Repositorio de HU y se recarga en el conocimiento que consultan los agentes.
              - heading "Cómo moverse entre pasos" [level=5] [ref=e116]
              - list [ref=e117]:
                - listitem [ref=e118]: "El avance se guarda cada vez que el flujo espera una respuesta: puede salir y retomarlo otro día desde Historias de Usuario → En proceso, aunque el servicio se haya reiniciado."
                - listitem [ref=e119]: Si un paso falla (por ejemplo, un agente no responde), el avance anterior queda guardado y aparece «Reintentar el paso que falló».
                - listitem [ref=e120]: Use Atrás para volver a ver un paso anterior sin perder lo escrito.
                - listitem [ref=e121]: Mientras los agentes trabajan se muestra una pantalla de espera; puede tardar varios minutos.
